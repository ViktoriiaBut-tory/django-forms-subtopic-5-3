{% extends "base.html" %}
{% block content %}
<h1>Add Student </h1>
<form method="post">
    {% csrf_token %}
    {{form.non_field_errors}}
    {%for field in form %}
    <div>
        {{field.label_tag}} {{field}}
        {% if field.help_text %}
        <small>{{field.help_text}}</small>
        {% endif %}

        {% for error in field.errors %}
        <p>{{error}}</p>
        {% endfor %}
    </div>
    {% endfor %}
    <input type="submit" value="save student"/>
</form>
{% endblock %}
