{% extends "base.html" %}
{% block content %}
<h1>Student record</h1>
{% if students %}
<table>
    <thead>
        <tr>
            <th>name</th>
            <th>Email</th>
            <th>Age</th>
            <th>Department</th>
        </tr>
    </thead>
    <tbody>
        {% for student in students %}
        <tr>
            <td>{{student.name}}</td>
            <th>{{student.email}}</th>
            <th>{{student.age}}</th>
            <th>{{student.department.name}}</th>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p>no student added yet</p>
{% endif %}
{% endblock %}
